/* === Automated live data layer ===
   The embedded U array is the safe offline fallback. When served from GitHub Pages,
   data/updates.json is fetched and becomes the current feed. */
async function loadLiveUpdates(){
  try{
    const r=await fetch('data/updates.json?ts='+Date.now(),{cache:'no-store'});
    if(!r.ok) throw new Error('updates.json '+r.status);
    const fresh=await r.json();
    if(Array.isArray(fresh) && fresh.length){
      U=fresh;
      try{localStorage.setItem('bankExamUpdatesCache',JSON.stringify(fresh));}catch(e){}
      try{localStorage.setItem('bankExamLastCheck',new Date().toISOString());}catch(e){}
      render();
      const ls=document.getElementById("liveStatusText"); if(ls) ls.textContent=liveStatus();
      return true;
    }
  }catch(e){
    try{
      const cached=JSON.parse(localStorage.getItem('bankExamUpdatesCache')||'null');
      if(Array.isArray(cached) && cached.length){U=cached;render();const ls=document.getElementById("liveStatusText");if(ls)ls.textContent=liveStatus();return true;}
    }catch(_e){}
  }
  return false;
}
function liveStatusShort(){
  try{
    const t=localStorage.getItem('bankExamLastCheck');
    if(t){
      const d=new Date(t);
      return 'Updated '+d.toLocaleString([], {day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
    }
  }catch(e){}
  return 'Live source checking';
}
function liveStatus(){
  try{
    const t=localStorage.getItem('bankExamLastCheck');
    if(t){const d=new Date(t); return 'Live data checked '+d.toLocaleString([], {day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});}
  }catch(e){}
  return 'Live data: waiting for first online check';
}

function src(org){return S.find(x=>x[0]===org)}
function L(e){return `<div class="logo ${e.logo}">${e.org}</div>`}
function categoryOf(org){
 const x=S.find(v=>v[0]===org);
 if(x) return x[1];
 if(["SBI","IBPS","SIDBI","BOI","IOB","EXIM","Indian Bank","PNB","Bank of Baroda","Canara Bank","Union Bank of India","Central Bank of India","UCO Bank","Bank of Maharashtra","Punjab & Sind Bank"].includes(org)) return "Banking";
 if(["LIC","NIACL","NICL","UIIC","OICL","ECGC","GIC"].includes(org)) return "Insurance";
 if(["RBI","NABARD","SEBI","IRDAI","PFRDA","IFSCA"].includes(org)) return "Regulatory";
 return "Other";
}
function filterOK(e){
 let q=st.q.toLowerCase();
 if(q && !(e.name+" "+e.org+" "+e.full).toLowerCase().includes(q)) return false;
 const cat=categoryOf(e.org);
 if(st.filter==="bank" && cat!=="Banking") return false;
 if(st.filter==="insurance" && cat!=="Insurance") return false;
 if(st.filter==="reg" && cat!=="Regulatory") return false;
 return true;
}

function goExternal(url){
  if(!url || url==="#") return false;
  try{ window.location.assign(url); }catch(e){ window.location.href=url; }
  return false;
}
function updateActionLinks(exam, fallbackUrl){

  const base=fallbackUrl||x.notice||x.notif||src(ref.org||"")||"#";
  const urlFor=(action)=>x[action]||ref[action]||base;
  const btn=(url,label,cls)=>`<button type="button" class="cardAction ${cls}" onclick='goExternal(${JSON.stringify(urlFor(url))})'>${label}</button>`;
  return `<div class="updateActions">
    ${btn("notif","📄 Notification PDF","notif")}
    ${btn("apply","📝 Apply Online","apply")}
    ${btn("call","🎫 Call Letter","call")}
    ${btn("result","🏆 Result","result")}
  </div>`;
}
function actionButtons(id){

    ${item(x.call,"🎫 Download Call Letter","call")}
    ${item(x.result,"🏆 Result","result")}

}

function updateDateValue(u){
  const s=(u.date||"")+" "+(u.text||"");
  const m=s.match(/(?:^|\\b)(\\d{1,2})\\s+(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*\\s+(20\\d{2})/i);
  if(m) return new Date(Number(m[3]),["jan","feb","mar","apr","may","jun","jul","aug","sep","oct","nov","dec"].indexOf(m[2].slice(0,3).toLowerCase()),Number(m[1]));
  return null;
}
function isCurrentUpdate(u){

// v26 Web Push client
function pushApi(){return (window.PUSH_CONFIG&&window.PUSH_CONFIG.apiUrl||'').replace(/\/$/,'');}
function b64ToUint8(s){const pad='='.repeat((4-s.length%4)%4);const raw=atob((s+pad).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from(raw,c=>c.charCodeAt(0));}
async function pushSupport(){return !!(location.protocol==='https:' && 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window && pushApi());}
async function pushState(){
  if(!(await pushSupport())) return 'unsupported';
  const p=Notification.permission;
  if(p==='denied') return 'denied';
  const reg=await navigator.serviceWorker.ready;
  const sub=await reg.pushManager.getSubscription();
  return sub?'subscribed':'not-subscribed';
}
async function enablePushAlerts(){
  try{
    if(!(await pushSupport())){toast('Open the HTTPS GitHub Pages app first');return;}
    const api=pushApi();
    const permission=Notification.permission==='granted'? 'granted' : await Notification.requestPermission();
    if(permission!=='granted'){toast('Notification permission was not granted');return;}
    const reg=await navigator.serviceWorker.ready;
    let sub=await reg.pushManager.getSubscription();
    if(!sub){
      const r=await fetch(api+'/config',{cache:'no-store'});
      if(!r.ok) throw new Error('Push config unavailable');
      const cfg=await r.json();
      if(!cfg.publicKey) throw new Error('Missing VAPID public key');
      sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64ToUint8(cfg.publicKey)});
    }
    const r=await fetch(api+'/subscribe',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({subscription:sub,examIds:st.my})});
    if(!r.ok) throw new Error('Subscription registration failed');
    try{localStorage.setItem('bankExamPushEnabled','1')}catch(e){}
    toast('Background exam alerts enabled');
    updatePushUi();
  }catch(e){console.error(e);toast('Could not enable alerts: '+e.message);}
}
async function disablePushAlerts(){
  try{
    const reg=await navigator.serviceWorker.ready; const sub=await reg.pushManager.getSubscription();
    if(sub){const api=pushApi(); if(api) await fetch(api+'/unsubscribe',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({endpoint:sub.endpoint})}); await sub.unsubscribe();}
    try{localStorage.removeItem('bankExamPushEnabled')}catch(e){}
    toast('Background alerts disabled'); updatePushUi();
  }catch(e){toast('Could not disable alerts');}
}

  if(state) state.textContent=on?"●":"◯";
  const btn=document.getElementById("darkModeBtn");
  if(btn) btn.setAttribute("aria-pressed", String(on));
  toast(on?"Dark mode enabled":"Dark mode disabled");
}
applyDarkMode();
setInterval(()=>{
  if(document.visibilityState==="visible") loadLiveUpdates().then(()=>render()).catch(()=>{});
},15*60*1000);

try{render();setTimeout(()=>loadLiveUpdates().then(()=>render()),50)}catch(err){
document.getElementById("main").innerHTML='<div style="padding:24px"><div class="card"><h2>Dashboard could not load</h2><p style="font-size:12px;color:#718096">Please refresh the page. Error: '+String(err.message||err)+'</p></div></div>';
console.error(err);
}
</script>
<div id="linkToast" class="linkToast">Opening official page…</div>
<script>
(function(){
  function toast(msg){
    const t=document.getElementById("linkToast");
    if(!t)return;
    t.textContent=msg;t.classList.add("show");
    clearTimeout(window.__toastTimer);
    window.__toastTimer=setTimeout(()=>t.classList.remove("show"),1600);
  }
  document.addEventListener("click",function(e){
    const a=e.target.closest("a[href]");
    if(a && a.target==="_blank" && !a.classList.contains("disabled")){
      toast("Opening official page…");
    }
  },true);
  window.addEventListener("keydown",function(e){
    if(e.key==="Escape") document.getElementById("linkToast")?.classList.remove("show");
  });
})();
</script>

<script>
window.addEventListener("error", function(ev){
  console.error("Dashboard error:", ev.error || ev.message);
  var root=document.getElementById("app");
  if(root && !root.querySelector(".runtime-error")){
    var box=document.createElement("div");
    box.className="card runtime-error";
    box.style.margin="18px 13px";
    box.innerHTML="<h3>Something went wrong</h3><p>Please refresh the dashboard. The error has been logged in the browser console.</p>";
    root.appendChild(box);
  }
});
window.addEventListener("unhandledrejection", function(ev){
  console.error("Dashboard promise error:", ev.reason);
});
</script>

<script>document.addEventListener("DOMContentLoaded",function(){try{render()}catch(e){console.error(e)}});</script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./service-worker.js", {scope:"./"})
      .catch(() => {});
  });
}
</script>
